[build]
base = "/"
# App only: upstream also builds the docs site and the UI story book into dist/docs and dist/ui.
command = "pnpm -F @proj-airi/stage-web run build"
publish = "/apps/stage-web/dist"

[build.environment]
NODE_VERSION = "24"
NODE_OPTIONS = "--max-old-space-size=4096"

[[redirects]]
from = "/assets/*"
to = "/assets/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false
